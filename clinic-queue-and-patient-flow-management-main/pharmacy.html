<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharmacy Dashboard | Smart Clinic</title>
  <style>
    :root{ --primary:#0a5ea5; --secondary:#14a0a0; --bg:#eef6ff; --card:#fff; --danger:#dc3545; }
    *{box-sizing:border-box;font-family:'Segoe UI',sans-serif;} body{margin:0;background:var(--bg);color:#222;} header{background:linear-gradient(90deg,var(--primary),var(--secondary));color:white;padding:20px 24px;font-size:22px;font-weight:600;} main{max-width:1200px;margin:auto;padding:24px;} .card{background:var(--card);padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,0.08);margin-bottom:20px;} .summary-grid{display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:12px;margin-bottom:16px;} .summary-card{background:#f4f9ff;border:1px solid #dce9f7;padding:14px;border-radius:12px;} .summary-card strong{display:block;font-size:20px;color:var(--primary);} .summary-card span{font-size:12px;color:#6c757d;} table{width:100%;border-collapse:collapse;} th,td{padding:12px;border-bottom:1px solid #e9ecef;text-align:left;} th{background:#f4f9ff;} .pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#e8f5e9;color:#2e7d32;font-size:12px;font-weight:600;} .pill.warn{background:#fff3cd;color:#856404;} .link{color:var(--primary);font-weight:600;text-decoration:none;} .muted{color:#6c757d;font-size:13px;} .actions{display:flex;gap:10px;flex-wrap:wrap;} button{padding:10px 12px;border:none;border-radius:8px;background:var(--primary);color:white;cursor:pointer;font-weight:600;} button.secondary{background:#6c757d;} @media(max-width:900px){.summary-grid{grid-template-columns:1fr 1fr;}} @media(max-width:600px){.summary-grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <header>💊 Pharmacy Dashboard</header>
  <main>
    <div class="card">
      <div class="actions" style="justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
        <h3 style="margin:0;">Pharmacy Operations</h3>
        <div class="actions">
          <a class="link" href="medicine.html">Medicine Catalog</a>
          <a class="link" href="cart.html">Patient Cart</a>
          <a class="link" href="patient.html">Patient Dashboard</a>
        </div>
      </div>
      <div id="summaryCards" class="summary-grid"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Current Stock Snapshot</h3>
      <table>
        <thead><tr><th>Medicine</th><th>Category</th><th>Stock</th><th>Status</th></tr></thead>
        <tbody id="stockTableBody"></tbody>
      </table>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">Recent Orders & Prescriptions</h3>
      <table>
        <thead><tr><th>Order</th><th>Patient</th><th>Status</th><th>Prescription</th></tr></thead>
        <tbody id="ordersTableBody"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/pharmacy.js"></script>
  <script type="module" src="js/helpDesk.js"></script>
</body>
</html>
