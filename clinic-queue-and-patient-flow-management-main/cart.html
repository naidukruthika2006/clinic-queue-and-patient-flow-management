<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medicine Cart | Smart Clinic</title>
  <style>
    :root{ --primary:#0a5ea5; --secondary:#14a0a0; --bg:#eef6ff; --card:#fff; }
    *{box-sizing:border-box;font-family:'Segoe UI',sans-serif;} body{margin:0;background:var(--bg);color:#222;} header{background:linear-gradient(90deg,var(--primary),var(--secondary));color:white;padding:20px 24px;font-size:22px;font-weight:600;} main{max-width:1000px;margin:auto;padding:24px;} .card{background:var(--card);padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,0.08);} table{width:100%;border-collapse:collapse;} th,td{padding:12px;border-bottom:1px solid #e9ecef;text-align:left;} th{background:#f4f9ff;} button{padding:10px 12px;border:none;border-radius:8px;background:var(--primary);color:white;cursor:pointer;font-weight:600;} .secondary{background:#6c757d;} .muted{color:#6c757d;font-size:13px;} .summary{margin-top:16px;padding:16px;background:#f8fbff;border-radius:10px;} .grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;} @media(max-width:800px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <header>🛒 Medicine Cart</header>
  <main>
    <div class="grid">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;">
          <h3 style="margin:0;">Your Selected Medicines</h3>
          <a href="medicine.html" style="color:#0a5ea5;font-weight:600;text-decoration:none;">Continue Shopping</a>
        </div>
        <table>
          <thead><tr><th>Medicine</th><th>Qty</th><th>Price</th><th>Subtotal</th><th>Remove</th></tr></thead>
          <tbody id="cartTableBody"></tbody>
        </table>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Checkout</h3>
        <label style="display:block;margin-top:8px;font-weight:600;">Patient Details</label>
        <input id="patientName" placeholder="Your Name" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ced4da;border-radius:8px;" />
        <label style="display:block;margin-top:10px;font-weight:600;">Address</label>
        <input id="address" placeholder="Address" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ced4da;border-radius:8px;" />
        <label style="display:block;margin-top:10px;font-weight:600;">Phone Number</label>
        <input id="phone" placeholder="Phone Number" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ced4da;border-radius:8px;" />
        <label style="display:block;margin-top:10px;font-weight:600;">Payment Method</label>
        <select id="paymentMethod" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ced4da;border-radius:8px;">
          <option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Card">Card</option>
        </select>
        <label style="display:block;margin-top:10px;font-weight:600;">Prescription Upload</label>
        <input id="prescriptionFile" type="file" style="width:100%;padding:10px;margin-top:6px;border:1px solid #ced4da;border-radius:8px;" />
        <div class="summary">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><strong>Total Amount</strong><span id="totalAmount">₹0</span></div>
          <button id="placeOrderBtn" style="width:100%;margin-top:10px;">Place Order</button>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/helpDesk.js"></script>
</body>
</html>
