<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retailer Dashboard | Smart Clinic</title>
  <style>
    :root{ --primary:#0a5ea5; --secondary:#14a0a0; --bg:#eef6ff; }
    *{box-sizing:border-box;font-family:'Segoe UI',sans-serif;} body{margin:0;background:var(--bg);color:#222;} header{background:linear-gradient(90deg,var(--primary),var(--secondary));color:white;padding:20px 24px;font-size:22px;font-weight:600;} main{max-width:1100px;margin:auto;padding:24px;} .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;} .card{background:white;padding:20px;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,0.08);} input,button{width:100%;padding:10px;border-radius:8px;border:1px solid #ced4da;margin-top:8px;font-size:14px;} button{background:var(--primary);color:white;border:none;cursor:pointer;font-weight:600;} table{width:100%;border-collapse:collapse;} th,td{padding:10px;border-bottom:1px solid #e9ecef;text-align:left;} th{background:#f4f9ff;} @media(max-width:800px){.grid{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <header>🏪 Retailer Dashboard</header>
  <main>
    <div class="grid">
      <div class="card">
        <h3 style="margin-top:0;">Add New Stock</h3>
        <select id="medicineSelect"></select>
        <input id="restockQty" type="number" placeholder="Quantity" />
        <button id="restockBtn">Restock Inventory</button>
      </div>
      <div class="card">
        <h3 style="margin-top:0;">Current Inventory</h3>
        <table>
          <thead><tr><th>Medicine</th><th>Qty</th><th>Price</th><th>Status</th></tr></thead>
          <tbody id="retailerTable"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script type="module" src="js/retailer.js"></script>
  <script type="module" src="js/helpDesk.js"></script>
</body>
</html>
