<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Patient Dashboard | Smart Clinic</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{ --primary:#0a5ea5; --secondary:#14a0a0; --bg:#eef6ff; --card:#ffffff; --danger:#dc3545; }
*{ margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", sans-serif; }
body{ background:linear-gradient(120deg,#e8f3ff,#f5fbff); min-height:100vh; }
header{ background:linear-gradient(90deg,var(--primary),var(--secondary)); color:white; padding:18px; text-align:center; font-size:22px; font-weight:600; letter-spacing:0.5px; box-shadow:0 6px 15px rgba(0,0,0,0.2); }
.card{ max-width:1100px; background:rgba(255,255,255,0.95); margin:35px auto; padding:30px; border-radius:18px; box-shadow:0 15px 40px rgba(0,0,0,0.15); }
.actions{ display:flex; flex-wrap:wrap; gap:12px; }
button{ padding:12px 18px; border:none; background:var(--primary); color:white; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:0.3s; }
button:hover{ transform:translateY(-2px); background:#084c86; }
.logout{ background:#6c757d; }
.logout:hover{ background:#5a6268; }
.nav-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin:20px 0 10px; }
.nav-card{ background:#f8fbff; border:1px solid #dce9f7; border-radius:12px; padding:14px; text-align:center; text-decoration:none; color:#0a5ea5; font-weight:600; }
.nav-card:hover{ background:#eef6ff; }
.hero-copy{ margin-bottom:18px; color:#2c3e50; }
.doctor-grid{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; }
.doctor-card{ display:flex; gap:14px; padding:16px; background:#f8fbff; border:1px solid #dce9f7; border-radius:14px; align-items:flex-start; }
.doctor-card img{ width:76px; height:76px; border-radius:50%; object-fit:cover; flex-shrink:0; }
.doctor-info{ flex:1; }
.doctor-info h4{ margin:0 0 6px; color:#0a5ea5; }
.doctor-info p{ margin:4px 0; font-size:13px; color:#4a5568; }
.muted{ color:#6c757d; }
.book-btn{ display:inline-block; margin-top:8px; padding:8px 12px; border-radius:999px; background:var(--secondary); color:white; text-decoration:none; font-weight:600; }
.loading, .error{ padding:18px; border-radius:10px; background:#f8fbff; border:1px solid #dce9f7; color:#0a5ea5; }
.error{ color:#dc3545; }
@media(max-width:800px){ .nav-grid{ grid-template-columns:1fr 1fr; } .doctor-grid{ grid-template-columns:1fr; } }
</style>
</head>

<body>

<header>🧑‍🤝‍🧑 Patient Dashboard – Smart Clinic</header>

<div class="card">

  <div class="nav-grid">
    <a class="nav-card" href="patient.html">Dashboard</a>
    <a class="nav-card" href="appointments.html">Book Appointment</a>
    <a class="nav-card" href="medicine.html">Available Medicines</a>
    <a class="nav-card" href="pharmacy.html">Pharmacy</a>
    <a class="nav-card" href="cart.html">Medicine Cart</a>
    <a class="nav-card" href="doctor.html">Doctors</a>
    <a class="nav-card" href="consumer.html">Orders</a>
  </div>

  <div class="hero-copy">
    <h3 style="margin:0 0 6px; color:#0a5ea5;">Available doctors</h3>
    <p style="margin:0;">The patient portal reads from the same doctor database used by the doctor console, so updates stay synchronized automatically.</p>
  </div>

  <div id="doctorCards" class="doctor-grid"></div>

  <br>
  <button class="logout" onclick="logout()">Logout</button>

</div>

<script type="module" src="js/patient.js"></script>
<script type="module" src="js/helpDesk.js"></script>


</body>
</html>
